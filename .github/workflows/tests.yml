name: PHP-CI
on: [push, pull_request]

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      # The functional suite renders real pages, and a layout asks for the entry point of its
      # theme: without the compiled bundle every page fails on the missing Vite manifest.
      - name: Build the assets
        run: |
          npm ci
          npm run build
        env:
          CI: true

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --ignore-platform-reqs

      # The list the local gate runs too (.agents/scripts/verify.sh): the coding standard, static
      # analysis, both test suites and the templates. None of it needs a database.
      - name: Run the checks
        run: composer -v check
